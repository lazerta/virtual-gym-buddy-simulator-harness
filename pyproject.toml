[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-buddy-test-harness"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.0",
  "pandas>=2.0",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pyarrow>=15", "scipy>=1.11", "trimesh>=4"]
vision = ["mediapipe>=0.10.14"]
all = ["pytest>=8", "hypothesis>=6", "pyarrow>=15", "scipy>=1.11", "trimesh>=4", "mediapipe>=0.10.14"]

[project.scripts]
gym-buddy-harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
