[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-buddy-test-harness"
version = "0.8.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.0",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pyarrow>=15", "scipy>=1.11", "trimesh>=4"]
vision = ["mediapipe>=0.10.14"]
mujoco = ["mujoco>=3.4", "myo-sim>=0.2.3"]
all = [
  "pytest>=8",
  "hypothesis>=6",
  "pyarrow>=15",
  "scipy>=1.11",
  "trimesh>=4",
  "mediapipe>=0.10.14",
  "mujoco>=3.4",
  "myo-sim>=0.2.3",
]

[project.scripts]
gym-buddy-harness = "harness.cli:main"
gym-buddy-mujoco-bridge = "harness.mujoco_bridge:main"
gym-buddy-sim = "harness.mujoco_viewer:main"
gym-buddy-video-motion = "harness.video_motion_pipeline:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
