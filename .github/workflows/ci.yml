name: harness-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: bash -n scripts/setup_motion_stack_wsl.sh
      - run: python -m pytest -q
      - name: Synthetic subject invariance gate
        run: python -m pytest -q tests/test_synthetic_subject_profile.py
      - run: python -m pytest -q tests/test_mmfit_adapter.py
      - run: python -m pytest -q tests/test_wham_video_pipeline.py
      - run: python -m pytest -q tests/test_frame_contract.py tests/test_frame_server.py tests/test_mujoco_frame_export.py

  url-ingestion-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          python -m yt_dlp --version
      - name: Real localhost URL download
        run: python -m pytest -q tests/test_url_ingestion_live.py -s

  visual-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visual/package.json
      - run: npm install
      - run: npm run smoke
      - run: npm run build

  mujoco-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[mujoco]" pytest
      - run: python -m harness.cli mujoco-smoke
      - run: python -m pytest -q tests/test_mujoco_backend_contract.py tests/test_motion_runtime.py
