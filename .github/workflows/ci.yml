name: harness-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: bash -n scripts/setup_motion_stack_wsl.sh
      - run: python -m pytest -q
      - run: python -m pytest -q tests/test_mmfit_adapter.py
      - run: python -m pytest -q tests/test_wham_video_pipeline.py

  visual-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visual/package.json
      - run: npm install
      - run: npm run smoke
      - run: npm run build

  mujoco-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[mujoco]" pytest
      - run: python -m harness.cli mujoco-smoke
      - run: python -m pytest -q tests/test_mujoco_backend_contract.py tests/test_motion_runtime.py
