<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Buddy Visual Harness</title>
  <style>
    html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#111}
    #hud{position:fixed;top:12px;left:12px;z-index:10;background:#000c;color:#fff;padding:10px 12px;border-radius:8px;font:13px monospace;white-space:pre}
    #controls{position:fixed;top:12px;right:12px;z-index:10;background:#000c;color:#fff;padding:10px;border-radius:8px;font:13px sans-serif}
    select{margin:4px 0;width:180px}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">loading...</div>
  <div id="controls">
    <div>Avatar</div><select id="avatar"></select>
    <div>Exercise</div><select id="exercise"></select>
    <div>Form</div><select id="form"></select>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
